<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Controle de Gastos V6</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffcc00">
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial;padding:10px}
.header{background:#ffcc00;color:#000;padding:16px;border-radius:18px;text-align:center;font-weight:900}
.header h1{margin:0;font-size:18px}.header p{margin:4px 0 0;font-size:12px;font-weight:700;opacity:.8}
.cards{display:flex;gap:8px;margin:12px 0}
.card{flex:1;background:#1a1a1a;border-radius:14px;padding:12px;text-align:center;font-weight:900;border:1px solid #222}
.card small{display:block;font-size:11px;color:#aaa}
.entradas{color:#00ff66}.saidas{color:#ff4444}.saldo{color:#ffcc00}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.btn-mini{padding:12px;border-radius:12px;border:0;font-weight:900;font-size:12px}
.btn-dark{background:#1a1a1a;color:#fff;border:1px solid #333}.btn-yellow{background:#ffcc00;color:#000}
.form{background:#1a1a1a;border-radius:18px;padding:12px;border:1px solid #222}
select,input{width:100%;padding:14px;border-radius:12px;border:1px solid #333;background:#000;color:#fff;margin-top:8px;font-size:14px}
.row{display:flex;gap:8px}.row input{flex:1}
.btn-main{width:100%;background:#ffcc00;color:#000;border:0;padding:16px;border-radius:14px;font-weight:900;margin-top:12px;font-size:15px}
.item{background:#151515;border-left:4px solid #ffcc00;border-radius:12px;padding:10px;margin-top:8px;display:flex;justify-content:space-between;align-items:center}
.item small{color:#888;display:block;font-size:11px}
.trash{background:#2a2a2a;border:0;padding:10px 14px;border-radius:10px;font-size:16px}
#lista{margin-top:10px;padding-bottom:80px}
</style>
</head>
<body>

<div class="header">
<h1>💲 CONTROLE DE GASTOS v6 ⚙️</h1>
<p>Tenha controle sobre seus gastos</p>
</div>

<div class="cards">
<div class="card"><small>Entradas R$</small><b class="entradas" id="entradas">0.00</b></div>
<div class="card"><small>Saídas R$</small><b class="saidas" id="saidas">0.00</b></div>
<div class="card"><small>Saldo R$</small><b class="saldo" id="saldo">0.00</b></div>
</div>

<div class="actions">
<button class="btn-mini btn-dark" onclick="document.getElementById('fileBackup').click()">♻️ RESTAURAR BACKUP</button>
<button class="btn-mini btn-dark" onclick="exportar()">💾 EXPORTAR BACKUP</button>
<button class="btn-mini btn-dark" onclick="compartilhar()">📤 COMPARTILHAR</button>
<button class="btn-mini btn-yellow" onclick="convidar()">👥 CONVIDAR MEMBROS</button>
<input type="file" id="fileBackup" hidden accept=".json" onchange="restaurar(this)">
</div>

<div class="form">
<select id="tipo"><option>📤 Gastei</option><option>📥 Recebi</option></select>
<select id="pessoa"><option>Aline Esposa</option><option>Eu</option><option>Casa</option><option>Moto</option><option>Alimentação</option></select>
<input id="desc" placeholder="Descrição (Ex: Uber, Moto)">
<input id="valor" type="number" step="0.01" placeholder="Valor R$">

<div class="row">
<input id="dataGasto" type="date">
<input id="horaGasto" type="time">
</div>
<p style="color:#666;font-size:11px;margin:6px 0 0 4px">📅 Data &nbsp;&nbsp; ⏰ Hora</p>

<button class="btn-main" onclick="salvar()">💾 LANÇAMENTO SALVAR</button>
</div>

<div id="lista"></div>

<script>
let gastos=JSON.parse(localStorage.getItem('gastos_v6')||'[]');
function initDH(){let a=new Date();document.getElementById('dataGasto').valueAsDate=a;document.getElementById('horaGasto').value=a.toTimeString().slice(0,5);}initDH();

function salvar(){
let tipo=document.getElementById('tipo').value;
let pessoa=document.getElementById('pessoa').value;
let desc=document.getElementById('desc').value.trim()||'Sem descrição';
let valor=parseFloat(document.getElementById('valor').value);
let data=document.getElementById('dataGasto').value;
let hora=document.getElementById('horaGasto').value;
if(!valor){alert('Digite o valor!');return}
gastos.unshift({id:Date.now(),tipo,pessoa,desc,valor,data,hora});
localStorage.setItem('gastos_v6',JSON.stringify(gastos));
document.getElementById('desc').value='';document.getElementById('valor').value='';initDH();render();
}

function render(){
let ent=0,sai=0,html='';
gastos.forEach(g=>{
if(g.tipo.includes('Recebi')) ent+=g.valor; else sai+=g.valor;
let dataBr=g.data?g.data.split('-').reverse().join('/'):'';
html+=`<div class="item"><div><b>${g.desc} - R$ ${g.valor.toFixed(2)}</b><small>${g.pessoa} • 📅 ${dataBr} ⏰ ${g.hora}</small></div><button class="trash" onclick="del(${g.id})">🗑️</button></div>`;
});
document.getElementById('lista').innerHTML=html||'<p style="text-align:center;color:#555;margin-top:20px">Nenhum gasto ainda. Adicione o primeiro!</p>';
document.getElementById('entradas').innerText=ent.toFixed(2);
document.getElementById('saidas').innerText=sai.toFixed(2);
document.getElementById('saldo').innerText=(ent-sai).toFixed(2);
}
function del(id){if(confirm('Apagar esse gasto?')){gastos=gastos.filter(g=>g.id!==id);localStorage.setItem('gastos_v6',JSON.stringify(gastos));render();}}

function exportar(){
let blob=new Blob([JSON.stringify(gastos)],{type:'application/json'});
let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`backup-gastos-${new Date().toISOString().split('T')[0]}.json`;a.click();
alert('Backup exportado! Salve esse arquivo no Drive.');
}
function restaurar(input){
let file=input.files[0]; if(!file) return;
let reader=new FileReader();
reader.onload=e=>{
try{
let dados=JSON.parse(e.target.result);
if(Array.isArray(dados)){gastos=dados; localStorage.setItem('gastos_v6',JSON.stringify(gastos)); render(); alert(`✅ ${dados.length} gastos restaurados!`);}
else alert('Arquivo inválido');
}catch(err){alert('Erro ao ler backup')}
};
reader.readAsText(file);
}
function compartilhar(){
let texto=`💰 Meu Controle de Gastos: Entradas R$ ${document.getElementById('entradas').innerText} | Saídas R$ ${document.getElementById('saidas').innerText} | Saldo R$ ${document.getElementById('saldo').innerText}`;
if(navigator.share){navigator.share({title:'Controle de Gastos',text:texto,url:location.href})}
else{navigator.clipboard.writeText(texto+' - '+location.href); alert('Link copiado!');}
}
function convidar(){
let msg=`👋 Entra no nosso Controle de Gastos compartilhado! Tenha controle sobre seus gastos junto comigo: ${location.href}`;
if(navigator.share){navigator.share({title:'Convite - Controle de Gastos',text:msg})}
else{prompt('Copie o convite:',msg)}
}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
render();
</script>
</body>
</html>
